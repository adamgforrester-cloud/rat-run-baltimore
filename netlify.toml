# Rat Run: Baltimore Changelog

## 2.0 — Stability Release
- Global leaderboard retained and isolated from gameplay.
- Rebuilt the 30-second frame loop around core clicker mechanics.
- Temporarily paused Ghoul, police, dogs, Gator, Gator-Aid, pedestrians and traffic interactions.
- Kept rats, traps, Adam, coffee, cheese, combos, countdown, music and Baltimore scenery.
- Added frame recovery that never prematurely ends a round.
- Added optional diagnostics at `?debug=1`.
- Added null filtering and safe delta-time limits.
